[project]
name = "sgl"
version = "0.1.0"
description = "Sistema Único de Gestión de Licitaciones y Contratos — Consultora ITO / SERVIU"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "tenacity>=9.0",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "itsdangerous>=2.2",
    "passlib[bcrypt]>=1.7",
    "openpyxl>=3.1",
    "selectolax>=0.3",
    "pypdf>=5.1",
    "pdfplumber>=0.11",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.7"]

[project.scripts]
sgl = "sgl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sgl = ["web/templates/**/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Las exclusiones se justifican una por una: una regla apagada sin motivo
# escrito es una regla que nadie sabe si se puede volver a encender.
ignore = [
    # FastAPI declara sus dependencias como Depends(...) en el valor por
    # defecto. Es la forma idiomatica del framework, no un descuido.
    "B008",
    # Hay cuatro capturas amplias deliberadas: bitacora de llamadas, contexto de
    # plantillas, health check y manejadores del bus de eventos. En los cuatro
    # casos un fallo secundario NO puede tumbar la operacion principal, y los
    # cuatro registran la excepcion completa. Ver comentarios en cada sitio.
    "BLE001",
    # `set[str] | None` como atributo de clase en los mixins de auditoria: es
    # configuracion declarativa por subclase, no estado mutable compartido.
    "RUF012",
    # Tests: los `with` anidados separan preparacion de verificacion y se leen
    # mejor asi que combinados.
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
# `parsear_fecha_mp` y `_parsear_dia` construyen fechas sin hora a proposito:
# el parametro `fecha` de la API es ddmmaaaa, sin zona. La conversion a UTC la
# hace `parsear_fecha_hora_api`, que si aplica la zona de Chile.
"src/sgl/core/tiempo.py" = ["DTZ007"]
"src/sgl/cli.py" = ["DTZ007"]
